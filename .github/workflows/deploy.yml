name: Deploy to GitHub Pages

on:
  push:
    branches: [ master, feature ]
  pull_request:
    branches: [ master, feature ]

jobs:
  lint-html:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Validate HTML
      run: |
        # Проверка дали index.html постои
        if [ ! -f "index.html" ]; then
          echo "Error: index.html not found!"
          exit 1
        fi
        
        # Просторна проверка за closing tags
        if ! grep -q "</html>" index.html; then
          echo "Error: Missing closing </html> tag!"
          exit 1
        fi
        if ! grep -q "</body>" index.html; then
          echo "Error: Missing closing </body> tag!"
          exit 1
        fi
        
        echo "✅ HTML validation passed!"

  docker-build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: |
        docker build -t si-2026-lab3:master-latest .
        echo "✅ Docker image built successfully!"

  docker-push:
    runs-on: ubuntu-latest
    needs: lint-html
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        BRANCH_NAME=$(echo ${GITHUB_REF#refs/heads/})
        docker build -t si-2026-lab3:${BRANCH_NAME}-latest .
        docker tag si-2026-lab3:${BRANCH_NAME}-latest ${{ secrets.DOCKER_USERNAME }}/si-2026-lab3:${BRANCH_NAME}-latest
        docker push ${{ secrets.DOCKER_USERNAME }}/si-2026-lab3:${BRANCH_NAME}-latest
        echo "✅ Docker image pushed to DockerHub!"

  deploy-pages:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: lint-html
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v3

    - name: Setup Pages
      uses: actions/configure-pages@v3

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v2
