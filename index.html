<!DOCTYPE html>
<html lang="mk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI 2026 - Lab 3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .status {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 5px;
            color: #27ae60;
            margin: 20px 0;
            border-left: 4px solid #27ae60;
        }

        .tech-stack {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }

        .tech-item {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 SI 2026 - Лабораторија 3</h1>
        <p>GitHub Actions CI/CD Pipeline</p>

        <div class="status">
            ✅ Deployment успешна!
        </div>

        <p>Оваа страница е развинета со GitHub Actions и Docker.</p>

        <div class="tech-stack">
            <div class="tech-item">🐳 Docker</div>
            <div class="tech-item">⚙️ GitHub Actions</div>
            <div class="tech-item">📦 CI/CD</div>
            <div class="tech-item">🌐 GitHub Pages</div>
        </div>
    </div>
</body>
</html>
